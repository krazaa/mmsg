---
deployment:
  tasks:
    - export APPPATH=/home1/lkloctte/mmsgroup
    - export PUBLICPATH=/home1/lkloctte/public_html

    # PHP dependencies
    - cd $APPPATH && /opt/cpanel/composer/bin/composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

    # Clear old caches before deployment
    - cd $APPPATH && /usr/local/bin/php artisan optimize:clear

    # Database
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force

    # Public assets
    - /bin/rsync -a --delete --exclude='.well-known/' --exclude='storage' $APPPATH/public/ $PUBLICPATH/

    # Hosting-specific front controller
    - /bin/cp $APPPATH/deployment/index.php $PUBLICPATH/index.php

    # Production optimization
    - cd $APPPATH && /usr/local/bin/php artisan config:cache
    - cd $APPPATH && /usr/local/bin/php artisan route:cache
    - cd $APPPATH && /usr/local/bin/php artisan view:cache
